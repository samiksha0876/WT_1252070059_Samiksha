# ===============================
# Cricket Scoreboard Server Config
# ===============================
server.port=8082
spring.application.name=cricket-score-management-system

# ===============================
# In-Memory H2 Database
# ===============================
spring.datasource.url=jdbc:h2:mem:cricketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (accessible at http://localhost:8082/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===============================
# Jackson Settings
# ===============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true
